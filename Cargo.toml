[package]
name = "rusti"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossterm = "0.29.0"
is-terminal = "0.4"
tokio = { version = "1", features = ["rt", "sync", "time", "net", "io-util"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
bytes = "1"

# small, fast binary: the whole point of this project
[profile.release]
lto = true
codegen-units = 1
strip = true
