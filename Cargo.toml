[package]
name = "rusti"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossterm = "0.29.0"
is-terminal = "0.4"
tokio = { version = "1", features = ["rt", "sync", "time", "net", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "native-tls"] }
futures-util = "0.3"
bytes = "1"

# /reload rebuilds with this profile, so release build time is felt in the TUI.
# Measured here after a one-line edit, steady state (ignore the first build
# after any profile/dependency change — it recompiles the world):
#   opt-level=3  23.5s / 3.27MB      opt-level=2  24.0s / 3.13MB
#   opt-level=s  19.0s / 2.55MB      opt-level=z  15.7s / 2.33MB
#   opt-level=z + trimmed reqwest    13.7s / 1.87MB   <- here
# "z" is both faster to optimize and much smaller; fat LTO's cost scales with
# how much IR it merges, so dropping reqwest's unused http2/charset helps twice.
# `incremental = true` was measured and changed nothing — LTO re-merges anyway.
[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
