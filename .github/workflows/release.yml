# Push a tag like v0.2.0 and this builds rusti for each platform and attaches
# the binaries to a GitHub Release. install.ps1 / install.sh download from
# releases/latest, so the newest tag is what everyone installs.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: windows-latest, asset: rusti-windows-x86_64.exe, bin: rusti.exe }
          # 22.04, not latest: an older glibc runs on more distros
          - { os: ubuntu-22.04, asset: rusti-linux-x86_64, bin: rusti }
          - { os: macos-latest, asset: rusti-macos-aarch64, bin: rusti }
          # Intel Mac cross-built on the Apple Silicon runner: macos-13 runners
          # sat queued for hours on both v0.1.0 and v0.1.1
          - { os: macos-latest, asset: rusti-macos-x86_64, bin: rusti, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # a cross-built binary cannot run here; the native arm64 job tests the same code
      - if: ${{ !matrix.target }}
        run: cargo test --release
      - run: cargo build --release --locked ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
      - shell: bash
        run: cp target/${{ matrix.target }}/release/${{ matrix.bin }} ${{ matrix.asset }}
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
